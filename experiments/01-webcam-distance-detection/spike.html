<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>VDT Care - Distance Detection Spike</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
  #wrap { position: relative; width: 640px; max-width: 100%; margin: 0 auto; }
  video { display: block; width: 100%; border-radius: 8px; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; border-radius: 8px; }
  #readout { width: 640px; max-width: 100%; margin: 12px auto; padding: 16px; background: #1b1b1b; border-radius: 8px; }
  #metric { font-size: 48px; font-weight: 700; }
  #status { font-size: 16px; margin-top: 8px; }
  .ok { color: #4ade80; }
  .warn { color: #fbbf24; }
  .close { color: #f87171; }
  #log { font-size: 13px; opacity: 0.7; margin-top: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="readout">
    <div>얼굴 간 거리 프록시 (픽셀, 눈-눈 거리)</div>
    <div id="metric">--</div>
    <div id="status">카메라 권한을 허용해주세요...</div>
    <div id="log"></div>
  </div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const metricEl = document.getElementById("metric");
const statusEl = document.getElementById("status");
const logEl = document.getElementById("log");

// 눈 바깥쪽 코너 landmark 인덱스 (MediaPipe FaceMesh 468/478 topology 기준)
const LEFT_EYE_OUTER = 33;
const RIGHT_EYE_OUTER = 263;

// 베이스라인/이동평균으로 잡음(jitter) 완화
let baseline = null;
let smoothed = null;
const SMOOTHING = 0.2; // 낮을수록 부드럽지만 반응 느림

// 지속 시간 추적 (반복적/지속적 패턴 감지 스파이크용)
let closeStartTime = null;
const CLOSE_THRESHOLD_RATIO = 1.25; // baseline 대비 25% 이상 커지면 "가까움" 후보
const SUSTAINED_MS = 5000; // 5초 이상 지속되면 로그 남김 (실제 임계값은 나중에 튜닝)

async function main() {
  statusEl.textContent = "모델 로딩 중...";
  const filesetResolver = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numFaces: 1,
  });

  statusEl.textContent = "카메라 요청 중...";
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  video.srcObject = stream;
  await new Promise((resolve) => (video.onloadedmetadata = resolve));
  video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  statusEl.textContent = "인식 중... 화면에서 가까워졌다 멀어졌다 해보세요.";
  requestAnimationFrame(() => loop(faceLandmarker));
}

function loop(faceLandmarker) {
  const now = performance.now();
  const result = faceLandmarker.detectForVideo(video, now);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (result.faceLandmarks && result.faceLandmarks.length > 0) {
    const lm = result.faceLandmarks[0];
    const p1 = lm[LEFT_EYE_OUTER];
    const p2 = lm[RIGHT_EYE_OUTER];

    const dx = (p1.x - p2.x) * canvas.width;
    const dy = (p1.y - p2.y) * canvas.height;
    const dist = Math.sqrt(dx * dx + dy * dy);

    smoothed = smoothed === null ? dist : smoothed * (1 - SMOOTHING) + dist * SMOOTHING;
    if (baseline === null) baseline = smoothed; // 첫 값을 기준선으로 (나중에 "가만히 있을 때 평균"으로 개선 가능)

    const ratio = smoothed / baseline;
    metricEl.textContent = smoothed.toFixed(1) + " px  (기준 대비 " + (ratio * 100).toFixed(0) + "%)";

    // 점 표시 (시각 확인용)
    ctx.fillStyle = "#4ade80";
    [p1, p2].forEach((p) => {
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    if (ratio > CLOSE_THRESHOLD_RATIO) {
      statusEl.textContent = "⚠ 가까워짐 감지";
      statusEl.className = ratio > 1.4 ? "close" : "warn";
      if (closeStartTime === null) closeStartTime = now;
      const duration = now - closeStartTime;
      if (duration > SUSTAINED_MS) {
        logEl.textContent =
          `[지속 감지] ${(duration / 1000).toFixed(1)}초간 가까움 지속 (기준 대비 ${(ratio * 100).toFixed(0)}%)\n` +
          logEl.textContent;
      }
    } else {
      statusEl.textContent = "정상 범위";
      statusEl.className = "ok";
      closeStartTime = null;
    }
  } else {
    statusEl.textContent = "얼굴을 찾을 수 없음";
    statusEl.className = "warn";
  }

  requestAnimationFrame(() => loop(faceLandmarker));
}

main().catch((err) => {
  statusEl.textContent = "에러: " + err.message;
  console.error(err);
});
</script>
</body>
</html>
